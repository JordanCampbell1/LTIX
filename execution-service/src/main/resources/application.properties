spring.application.name=LTIX - Execution Service
spring.application.name=LTIX
spring.datasource.url=jdbc:postgresql://localhost:5433/app_db
spring.datasource.username=app_user
spring.datasource.password=app_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
server.port=8080

spring.jpa.hibernate.ddl-auto=none 
#stops automatic schema updates
management.endpoints.web.exposure.include=health,info,flyway
spring.flyway.baseline-on-migrate=true

